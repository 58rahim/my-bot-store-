<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر البوتات</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #2d2d2d; border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid #444; }
        button { background: #0088cc; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🛍️ متجرنا الذكي</h1>
    <div class="card">
        <h2>بوت التداول الآلي</h2>
        <p>السعر: 150$</p>
        <button onclick="sendData('بوت تداول')">طلب الآن</button>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        function sendData(item) {
            tg.sendData(item);
        }
    </script>
</body>
</html>
