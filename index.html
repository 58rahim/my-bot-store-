<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر البوتات</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <h1 class="text-2xl font-bold text-center mb-6">قائمة المنتجات</h1>
    
    <div class="bg-white p-4 rounded-lg shadow-md mb-4 text-center">
        <h2 class="text-xl font-bold">بوت تداول ذهب</h2>
        <p class="text-blue-600 font-bold my-2">150$</p>
        <button onclick="sendOrder('بوت تداول ذهب')" class="bg-green-500 text-white px-10 py-2 rounded-full font-bold">
            طلب الآن
        </button>
    </div>

    <div class="bg-white p-4 rounded-lg shadow-md text-center">
        <h2 class="text-xl font-bold">قالب n8n متكامل</h2>
        <p class="text-blue-600 font-bold my-2">45$</p>
        <button onclick="sendOrder('قالب n8n')" class="bg-green-500 text-white px-10 py-2 rounded-full font-bold">
            طلب الآن
        </button>
    </div>

    <script>
        // هذا الجزء الصغير ضروري جداً لكي يفهم التلغرام أنك ضغطت الزر
        const tg = window.Telegram.WebApp;
        function sendOrder(productName) {
            tg.sendData(productName); // يرسل اسم المنتج للبوت الخاص بك
        }
    </script>
</body>
</html>
